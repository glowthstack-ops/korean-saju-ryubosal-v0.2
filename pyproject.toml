[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saju-v2"
version = "2.1.0"
description = "류보살 v2 — deterministic Korean Saju (만세력) engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "tzdata>=2024.1",
    "korean-lunar-calendar>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]
# Astronomy tools are only needed to (re)generate the solar-term table offline.
astro = [
    "skyfield>=1.49",
]

# ---------------------------------------------------------------------------
# Monorepo workspace: each domain lives in its own importable package but is
# installed together as a single editable distribution to avoid friction.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = [
    "packages/shared_types",
    "packages/manse_core",
    "apps/api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/shared_types", "packages/manse_core", "apps/api", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
