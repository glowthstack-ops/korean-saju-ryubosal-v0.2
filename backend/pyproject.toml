[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saju-v2"
version = "2.1.0"
description = "류보살 v2 — deterministic Korean Saju (만세력) engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "tzdata>=2024.1",
    "korean-lunar-calendar>=0.3.1",
    # Precompute Store (luck_composites) — v1 DB와 분리된 전용 인스턴스(5433) 사용.
    "psycopg[binary]>=3.1",
    # LLM 통변 서술(Gemini 메인 + OpenAI 폴백, REST) — llm_guard 경유 호출 전용.
    "httpx>=0.27",
    # 일주별 오늘의 운세 휘발성 TTL 캐시(daily_fortune_cache) — 운영 필수, 로컬은 InMemory 대체 가능.
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]
# Astronomy tools are only needed to (re)generate the solar-term table offline.
astro = [
    "skyfield>=1.49",
]
# Intent 유사도 보조 분류기(런타임) — ONNX contextual 임베딩 추론. torch 불요(CPU·무API).
# 미설치 시 intent_embedding가 비활성(규칙 파서만 동작) — 베이스 런타임은 영향 없음.
intent = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]
# Intent 분류기 모델 (재)생성용 빌드타임 전용 — ONNX export·int8 양자화·distill. 배포 런타임 미포함.
intent-build = [
    "torch>=2.2",
    "transformers>=4.40",
    "optimum[onnxruntime]>=1.19",
]
# Tier B 지역 지형 feature (재)생성용 빌드타임 전용(scripts/build_geo_features.py). OSM 행정경계·
# 토지피복·수계 + Copernicus DEM 공간조인. 런타임 엔진은 compiled 스냅샷만 쓰므로 미포함.
geo-build = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.6",
]

# ---------------------------------------------------------------------------
# Monorepo workspace: each domain lives in its own importable package but is
# installed together as a single editable distribution to avoid friction.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = [
    "packages/shared_types",
    "packages/manse_core",
    "packages/manse_analysis",
    "packages/manse_calibration",
    "packages/saju_engines",
    "apps/api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/shared_types", "packages/manse_core", "packages/saju_engines", "apps/api", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 감사 하네스(읽기 전용 측정 스크립트) — 측정 라벨·시나리오 문자열이 길다.
"scripts/audits/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# 검사 범위 SSOT — production 패키지만이 blocking 게이트다. CI·문서는 경로를 다시
# 나열하지 않고 scripts/typecheck.sh 를 호출한다(범위 변경은 여기 한 곳에서만).
#
# tests/ 와 scripts/ 는 blocking 대상이 아니다. 기존 부채가 있고(2026-07-30 기준
# full-tree 312건 = tests 51 + scripts 261 + production 0), 그 정리는 별도 작업이다.
# 진단은 `python -m mypy --no-incremental .` 로 따로 돌린다.
mypy_path = [
    "apps/api",
    "packages/saju_engines",
    "packages/shared_types",
    "packages/manse_core",
    "packages/manse_analysis",
    "packages/manse_calibration",
]
packages = [
    "saju_api",
    "saju_engines",
    "saju_shared_types",
    "saju_manse_core",
    "saju_manse_analysis",
    "saju_manse_calibration",
]

# ── 내부 import 해석 강제 (2026-07-31) ──────────────────────────────────
#
# 전역 `ignore_missing_imports = true` 는 stub 없는 외부 패키지 때문에 유지한다. 다만
# 그 설정이 **내부 모듈 오타까지 Any 로 흡수**해 mypy 가 `Success` 를 내는 사례가 실제로
# 있었다(없는 모듈 경로로 타입 주석을 달았는데 통과했고, 런타임 pytest 가 잡았다).
#
# 그래서 내부 package 에서는 미해석 import 를 차단한다. 실측상 production 6 package 의
# 내부 모듈 누락은 0건이라 즉시 적용 가능하다.
[[tool.mypy.overrides]]
module = [
    "saju_api.*",
    "saju_engines.*",
    "saju_shared_types.*",
    "saju_manse_core.*",
    "saju_manse_analysis.*",
    "saju_manse_calibration.*",
]
ignore_missing_imports = false

# 외부 패키지 예외 — 구현은 존재하지만 현재 환경에서 타입 정보가 제공되지 않는다.
# **내부 import 누락을 숨기기 위한 예외가 아니다.** 좁게, 패키지별로만 둔다.
[[tool.mypy.overrides]]
module = [
    "tokenizers.*",
    "onnxruntime.*",
    "korean_lunar_calendar.*",
    "geopandas.*",
]
ignore_missing_imports = true

