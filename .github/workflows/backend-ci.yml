# v2.2 Phase 8 T8.3 — 백엔드 회귀 게이트(검증 게이트와 동일: pytest+ruff+mypy+사전 validate).
# DB 라이브 테스트는 러너에 saju-v2-db가 없으므로 자동 skip(테스트 측 skipif).
name: backend-ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 전용 DB(docker-compose.yml 의 saju-v2-db 와 같은 이미지·계정·호스트 포트) — 2026-10-08 데굴님
    # 승인. 대화 스레드·사주 저장소 등 DB 를 쓰는 테스트가 로컬과 같은 조건으로 돈다
    # (conftest._isolate_test_db 가 '<db>_test' 를 만들고 migrations/ 를 적용).
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: saju_v2
          POSTGRES_PASSWORD: saju_v2
          POSTGRES_DB: saju_v2
        ports:
          - "15432:5432"
        options: >-
          --health-cmd "pg_isready -U saju_v2 -d saju_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SAJU_V2_DATABASE_URL: postgresql://saju_v2:saju_v2@localhost:15432/saju_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Validate dictionaries
        run: python scripts/validate_dictionaries.py
      - name: Ruff
        run: ruff check .
      # Production 타입 게이트 — 범위는 backend/pyproject.toml 의 packages 가 SSOT.
      # 여기서 패키지 경로를 다시 나열하지 않는다. `mypy .` 는 tests/scripts 의 기존
      # 부채(2026-07-30 기준 312건) 때문에 blocking 게이트가 될 수 없다.
      - name: Mypy (production gate)
        run: ../scripts/typecheck.sh
      - name: Pytest (회귀 포함)
        run: pytest -q
